<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="BZrs5C1vkydTWmvo65ik8SX03bVKMx47tmej91V4hE" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>椿枫漫笔</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>

    <!-- 加上了文字内容和高度撑开的完整菜单栏 -->
    <header class="site-header" style="background-image: url('/images/maple.png'); background-size: cover; background-position: center; padding: 60px 20px; text-align: center;">
      <!-- 博客的大标题 -->
      <h1 style="margin: 0; padding-bottom: 10px; font-size: 2.5rem;">
        <a href="/" style="color: #ffffff; text-decoration: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); font-weight: bold;">椿枫漫笔</a>
      </h1>
      <!-- 导航菜单按钮 -->
      <nav style="margin-top: 15px;">
        <a href="/" style="color: #ffffff; margin: 0 15px; text-decoration: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 1.1rem;">首页</a>
        <a href="/drafts/" style="color: #ffffff; margin: 0 15px; text-decoration: none; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); font-size: 1.1rem;">草稿箱</a>
      </nav>
    </header>

    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}
    </div>
  </body>
</html>
