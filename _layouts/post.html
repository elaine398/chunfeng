<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | 椿枫漫笔</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
<body>

  <!-- 1. 🌟 TOP BAR 顶部横带区（名字与菜单完美并排） -->
  <div class="custom-top-bar" style="padding: 25px 40px; border-bottom: 2px solid #e8dfcf; display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
    <div class="top-bar-left-branding">
      <a class="top-brand-name-link" href="/chunfeng/" style="font-size: 1.9em; font-weight: bold; color: #2c3e50; text-decoration: none;">椿枫漫笔</a>
      <span class="top-brand-subtitle" style="font-size: 0.95em; color: #7f8c8d; font-style: italic; margin-left: 15px;">Let's not remember years, remember moments</span>
    </div>
    <div class="top-bar-right-menu" style="display: flex; gap: 25px;">
      <a class="top-menu-item" href="/chunfeng/" style="font-size: 1.1em; font-weight: bold; color: #34495e; text-decoration: none;">主页</a>
      <a class="top-menu-item" href="/chunfeng/about" style="font-size: 1.1em; font-weight: bold; color: #34495e; text-decoration: none;">关于我</a>
    </div>
  </div>

  <!-- 2. 📰 CORE SPLIT MAGAZINE INTERFACE（在单独文章页里完美复刻主页的双栏比例） -->
  <div class="magazine-layout-wrapper" style="display: flex; flex-direction: row; flex-wrap: nowrap; gap: 45px; align-items: flex-start; padding: 40px; width: 100%; box-sizing: border-box;">
    
    <!-- 🧭 左边栏：310px黄金身材，永恒悬浮常驻 -->
    <div class="left-sidebar-menu-panel" style="flex: 0 0 310px; width: 310px; min-width: 310px; background-color: #faf9f6; padding: 20px; border-radius: 12px; border: 1px solid #f2ede4; position: sticky; top: 25px; max-height: calc(100vh - 90px); overflow-y: auto; box-sizing: border-box;">
      <div class="sidebar-menu-title" style="font-size: 1.05em; font-weight: bold; color: #2c3e50; padding-bottom: 10px; margin-bottom: 15px; border-bottom: 2px solid #e8dfcf;">📚 专栏分类</div>
      <div class="sidebar-accordion-group" style="display: flex; flex-direction: column; gap: 12px;">
        <!-- 极其贴心的路标：引导读者看完随笔后，一秒一键飞回主大厅看其他分类 -->
        <a class="sidebar-category-box" href="/chunfeng/" style="display: flex; justify-content: space-between; padding: 13px 15px; background: #ffffff; border: 1px solid #eef0f2; border-radius: 8px; text-decoration: none; color: #34495e; font-weight: bold;">
          <span>↩ 返回主页专栏</span>
          <span>▶</span>
        </a>
        <div style="font-size: 0.88em; color: #7f8c8d; font-style: italic; padding: 10px 5px; line-height: 1.4; text-align: justify;">
          您当前正在阅读具体文章。点击上方按钮可一秒回主页菜单。
        </div>
      </div>
    </div>

    <!-- 📄 右边中央主舞台：行云流水、段落极其分明的长散文畅读房间 -->
    <div class="right-articles-flow-panel" style="flex: 1; min-width: 0; word-break: break-word;">
      <h1 class="article-inside-title" style="font-size: 2.3em; color: #2c3e50; font-weight: bold; line-height: 1.35; margin-top: 0; margin-bottom: 15px;">{{ page.title }}</h1>
      <div class="article-inside-meta" style="font-size: 0.9em; color: #7f8c8d; margin-bottom: 35px; padding-bottom: 15px; border-bottom: 1px solid #f2ede4; display: flex; gap: 12px;">
        <span>📅 发布时间：{{ page.date | date: "%Y-%m-%d" }}</span>
        {% if page.tags.size > 0 %}
          <span style="color: #e8dfcf;">|</span>
          <span>🏷️ 所属专栏：{{ page.tags | first }}</span>
        {% endif %}
      </div>
      
      <!-- 墨香正文区：强制注入 1.95 黄金行距与 1.6em 书籍大留白 -->
      <div class="article-inside-body" style="font-size: 1.16em; color: #2c3e50; line-height: 1.95; letter-spacing: 0.5px; text-align: justify;">
        {{ content }}
      </div>
    </div>

  </div>

  <style>
    /* 🔒 稳稳锁死：令文章页面内的每一大段文字下方，必须足足空出 1.6em 宽敞舒适的呼吸大空白！ */
    .article-inside-body p { margin-top: 0 !important; margin-bottom: 1.6em !important; }
    footer, .site-footer, section.sidebar, .theme-by { display: none !important; }
  </style>

</body>
</html>
